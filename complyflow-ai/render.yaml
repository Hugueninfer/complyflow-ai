# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
services:
  - type: web
    name: complyflow-ai
    runtime: docker
    plan: free
    region: oregon
    rootDir: complyflow-ai
    dockerContext: .
    dockerfilePath: ./infra/docker/production/Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: APP_KEY_MATERIAL
        generateValue: true
      - key: PROCESSOR_HMAC_SECRET
        generateValue: true
      - key: DB_URL
        fromDatabase:
          name: complyflow-db
          property: connectionString
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_LIFETIME
        value: "1440"
      - key: SESSION_EXPIRE_ON_CLOSE
        value: "false"
      - key: AI_PROVIDER
        value: groq
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: AI_DAILY_REQUIREMENT_LIMIT
        value: "20"
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
databases:
  - name: complyflow-db
    databaseName: complyflow
    user: complyflow
    plan: free
    region: oregon
    postgresMajorVersion: "17"
    ipAllowList: []
