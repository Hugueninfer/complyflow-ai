[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "complyflow-processor"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "anyio==4.10.0",
  "fastapi==0.116.1",
  "httpx==0.28.1",
  "pydantic==2.11.7",
  "pypdf==6.0.0",
  "pytest==8.4.1",
  "pytest-cov==6.2.1",
  "uvicorn[standard]==0.35.0",
]

[tool.pytest.ini_options]
addopts = "--strict-markers"
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools]
packages = []
