expose_php=Off
display_errors=Off
log_errors=On
error_log=/proc/self/fd/2
memory_limit=96M
upload_max_filesize=5M
post_max_size=6M
max_execution_time=60
opcache.enable=1
opcache.memory_consumption=32
opcache.interned_strings_buffer=4
opcache.max_accelerated_files=10000
opcache.validate_timestamps=0
zend.assertions=-1
