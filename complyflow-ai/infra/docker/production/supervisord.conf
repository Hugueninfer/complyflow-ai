[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/supervisord.pid
childlogdir=/tmp
environment=HOME="/tmp"

[program:processor]
directory=/app/services/processor
command=/usr/bin/env -u DB_URL -u DB_PASSWORD -u APP_KEY -u APP_KEY_MATERIAL /opt/python/bin/python3.12 -m uvicorn app.main:app --host 127.0.0.1 --port 8001 --workers 1 --limit-concurrency 4 --no-access-log --timeout-graceful-shutdown 20
priority=10
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=25
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:php-fpm]
command=/usr/local/sbin/php-fpm --nodaemonize
priority=20
autorestart=true
stopsignal=QUIT
stopwaitsecs=25
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:queue]
directory=/app/apps/api
command=/usr/local/bin/php artisan queue:work --sleep=3 --tries=3 --timeout=90 --memory=80 --max-time=3600
priority=30
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=95
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -c /tmp/complyflow-nginx.conf -g "daemon off;"
priority=40
autorestart=true
stopsignal=QUIT
stopwaitsecs=25
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
