worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 128; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    sendfile on;
    client_body_temp_path /tmp/nginx-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;
    client_max_body_size 6m;
    keepalive_timeout 15;
    server {
        listen __PORT__;
        root /app/apps/api/public;
        index index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        location ~ /\. { deny all; }
        location ~ \.php$ { return 404; }
        location ~ ^/(api(?:/|$)|sanctum(?:/|$)|up$) {
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /app/apps/api/public/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_read_timeout 65s;
        }
        location /assets/ { try_files $uri =404; expires 1y; }
        location / { try_files $uri /index.html; }
    }
}
