worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 128; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    sendfile on;
    client_body_temp_path /tmp/nginx-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;
    client_max_body_size 6m;
    keepalive_timeout 15;
    server {
        listen __PORT__;
        root /app/apps/api/public;
        index index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        location ~ /\. { deny all; }
        location ~ \.php$ { return 404; }
        location ~ ^/(api(?:/|$)|sanctum(?:/|$)|up$) {
            # Explicit CGI parameters avoid duplicate HTTPS/SERVER_PORT from fastcgi_params.
            # FPM is loopback-only. Public scheme/authority are injected from validated APP_URL.
            fastcgi_param QUERY_STRING $query_string;
            fastcgi_param REQUEST_METHOD $request_method;
            fastcgi_param CONTENT_TYPE $content_type;
            fastcgi_param CONTENT_LENGTH $content_length;
            fastcgi_param SCRIPT_FILENAME /app/apps/api/public/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_param REQUEST_URI $request_uri;
            fastcgi_param DOCUMENT_URI $document_uri;
            fastcgi_param DOCUMENT_ROOT $document_root;
            fastcgi_param SERVER_PROTOCOL $server_protocol;
            fastcgi_param GATEWAY_INTERFACE CGI/1.1;
            fastcgi_param SERVER_SOFTWARE nginx;
            fastcgi_param REMOTE_ADDR $remote_addr;
            fastcgi_param REMOTE_PORT $remote_port;
            fastcgi_param SERVER_ADDR $server_addr;
            fastcgi_param REDIRECT_STATUS 200;
            fastcgi_param REQUEST_SCHEME __PUBLIC_SCHEME__;
            fastcgi_param HTTPS __PUBLIC_HTTPS__;
            fastcgi_param SERVER_PORT __PUBLIC_PORT__;
            fastcgi_param SERVER_NAME __PUBLIC_HOST__;
            fastcgi_param HTTP_HOST __PUBLIC_AUTHORITY__;
            fastcgi_param HTTP_FORWARDED "";
            fastcgi_param HTTP_X_FORWARDED_FOR "";
            fastcgi_param HTTP_X_FORWARDED_HOST "";
            fastcgi_param HTTP_X_FORWARDED_PROTO "";
            fastcgi_param HTTP_X_FORWARDED_PORT "";
            fastcgi_param HTTP_X_FORWARDED_PREFIX "";
            fastcgi_param HTTP_X_FORWARDED_SSL "";
            fastcgi_param HTTP_X_REAL_IP "";
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_read_timeout 65s;
        }
        location /assets/ { try_files $uri =404; expires 1y; }
        location / { try_files $uri /index.html; }
    }
}
